<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" class="dark">
<head>
  <!-- ========================================== -->
  <!-- 🛡️ MÓDULO DE SEGURANÇA (ANTI-PIRATARIA) 🛡️ -->
  <!-- ========================================== -->
  <script>
    (function() {
      const currentDomain = window.location.hostname;
      const isLocal = currentDomain === 'localhost' || currentDomain === '127.0.0.1' || currentDomain === '';
      const isVercel = currentDomain.includes('vercel.app');
      const isOficial = currentDomain.includes('portaloppah.com.br'); 
      
      if (!isLocal && !isVercel && !isOficial) {
        document.documentElement.innerHTML = '<body style="background:#0f172a;color:#ef4444;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;"><div><h1 style="font-size:2rem;margin-bottom:10px;">🛡️ Acesso Negado</h1><p>Licença de uso inválida ou domínio não autorizado.</p></div></body>';
        window.stop();
        throw new Error("Execução interrompida por violação de segurança.");
      }
    })();

    // Bloqueio do F12 e Botão Direito para evitar curiosos
    document.addEventListener('contextmenu', event => event.preventDefault()); 
    document.addEventListener('keydown', event => {
      if (event.key === 'F12') event.preventDefault();
      if (event.ctrlKey && (
          (event.shiftKey && (event.key === 'I' || event.key === 'i')) || 
          (event.shiftKey && (event.key === 'J' || event.key === 'j')) || 
          event.key === 'U' || event.key === 'u' || 
          event.key === 'S' || event.key === 's'
      )) {
        event.preventDefault();
      }
    });
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Oppah v2.5.2 | Cloud & Anti-Fraude</title>
  
  <script src="https://cdn.tailwindcss.com"></script>

    }
  </script>

      <h1 class="text-2xl font-black tracking-tight text-white">Portal Oppah <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">v2.5.2</span></h1>
      <p class="text-xs text-slate-400 mt-1">Otimizador de Corte Industrial & Gestão SaaS</p>

    <div class="flex p-1 bg-slate-900/80 rounded-2xl border border-slate-800 mb-6">

        Entrar

      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">CPF ou CNPJ</label>
        <div class="relative">
          <i class="fa-solid fa-id-card absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="text" id="reg-documento" required oninput="applyMaskCpfCnpj(event)" placeholder="000.000.000-00 ou CNPJ" class="w-full pl-9 pr-3 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-sky-500 transition-all">
        </div>

        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nome da Esquadria</label>

          <i class="fa-solid fa-building absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="text" id="reg-company" required placeholder="Ex: Vidros & Alumínio Silva" class="w-full pl-9 pr-3 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-sky-500 transition-all">
        </div>

        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Senha</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" class="w-full pl-9 pr-3 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-sky-500 transition-all">
        </div>
      </div>
      <button type="submit" id="btn-register" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-xs rounded-xl shadow-lg transition-all flex items-center justify-center space-x-2">
        <span id="btn-register-text">Verificar E-mail e Cadastrar</span>
        <i id="btn-register-icon" class="fa-solid fa-shield-halved text-xs"></i>
      </button>
    </form>
  </main>

  <!-- PAINEL DO GESTOR (Simplificado para o exemplo) -->
  <div id="gestor-dashboard" style="display:none;" class="max-w-4xl mx-auto space-y-6">
    <header class="glass-card rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-extrabold flex items-center gap-2">🏢 Painel da Empresa</h1>
        <p id="gestorCompanyName" class="text-sm text-sky-400 font-bold mt-1"></p>
        <p id="gestorEmail" class="text-xs text-slate-400"></p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="handleLogout()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold transition-all">Sair</button>
      </div>
    </header>
  </div>

  <script>
    // Configurações do Sistema na Nuvem
    let OPPAH_CONFIG = {};

    window.onload = async function() {
      // Tenta baixar as configurações do arquivo config.json local/Vercel
      try {
        const response = await fetch('./config.json');
        if (response.ok) {
          OPPAH_CONFIG = await response.json();
          localStorage.setItem('oppah_config_api', JSON.stringify(OPPAH_CONFIG));
        }
      } catch (err) {
        console.warn("Usando configurações em cache", err);
        OPPAH_CONFIG = JSON.parse(localStorage.getItem('oppah_config_api') || '{}');
      }

      if (!localStorage.getItem('oppah_empresas')) localStorage.setItem('oppah_empresas', JSON.stringify([]));
      
      const sessaoStr = localStorage.getItem('oppah_session');
      if (sessaoStr) {
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('gestor-dashboard').style.display = 'block';
        const s = JSON.parse(sessaoStr);
        document.getElementById('gestorCompanyName').innerText = s.nome_empresa || 'Empresa';
        document.getElementById('gestorEmail').innerText = s.email;
      }
    };

    // Máscara e Validação de CPF/CNPJ
    function applyMaskCpfCnpj(event) {
      let v = event.target.value.replace(/\D/g, "");
      if (v.length <= 11) {
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      } else {
        v = v.replace(/^(\d{2})(\d)/, "$1.$2");
        v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
        v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
        v = v.replace(/(\d{4})(\d)/, "$1-$2");
      }
      event.target.value = v.substring(0, 18);
    }

    function validarCpfCnpjAlgoritmo(val) {
      const doc = val.replace(/\D/g, '');
      if (doc.length === 11) {
        if (/^(\d)\1+$/.test(doc)) return false;
        let soma = 0, resto;
        for (let i = 1; i <= 9; i++) soma += parseInt(doc.substring(i-1, i)) * (11 - i);
        resto = (soma * 10) % 11;
        if ((resto === 10) || (resto === 11)) resto = 0;
        if (resto !== parseInt(doc.substring(9, 10))) return false;
        soma = 0;
        for (let i = 1; i <= 10; i++) soma += parseInt(doc.substring(i-1, i)) * (12 - i);
        resto = (soma * 10) % 11;
        if ((resto === 10) || (resto === 11)) resto = 0;
        return resto === parseInt(doc.substring(10, 11));
      } else if (doc.length === 14) {
        if (/^(\d)\1+$/.test(doc)) return false;
        let tamanho = doc.length - 2;
        let numeros = doc.substring(0, tamanho);
        let digitos = doc.substring(tamanho);
        let soma = 0, pos = tamanho - 7;
        for (let i = tamanho; i >= 1; i--) {
          soma += numeros.charAt(tamanho - i) * pos--;
          if (pos < 2) pos = 9;
        }
        let resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
        if (resultado !== parseInt(digitos.charAt(0))) return false;
        tamanho = tamanho + 1;
        numeros = doc.substring(0, tamanho);
        soma = 0; pos = tamanho - 7;
        for (let i = tamanho; i >= 1; i--) {
          soma += numeros.charAt(tamanho - i) * pos--;
          if (pos < 2) pos = 9;
        }
        resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
        return resultado === parseInt(digitos.charAt(1));
      }
      return false;
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      if (!toast) return;
      document.getElementById('toast-message').innerText = message;
      const icon = document.getElementById('toast-icon');
      if (type === 'error') {
        document.getElementById('toast-title').innerText = 'Atenção';
        icon.className = 'w-8 h-8 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center';
        icon.innerHTML = '<i class="fa-solid fa-xmark text-sm"></i>';
      } else {
        document.getElementById('toast-title').innerText = 'Sucesso';
        icon.className = 'w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center';
        icon.innerHTML = '<i class="fa-solid fa-check text-sm"></i>';
      }
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.transform = 'translateY(-150%)'; toast.style.opacity = '0'; }, 4000);
    }

    let pendingRegistrationData = null;
    let generatedOTP = null;

    async function initiateRegistration(e) {
      e.preventDefault();
      
      const btnText = document.getElementById('btn-register-text');
      const btnIcon = document.getElementById('btn-register-icon');
      btnText.innerText = "Verificando dados...";
      btnIcon.className = "fa-solid fa-spinner fa-spin text-xs";

      const documentoRaw = document.getElementById('reg-documento').value;
      const documentoClean = documentoRaw.replace(/\D/g, "");
      
      // 1. Validação Matemática
      if (!validarCpfCnpjAlgoritmo(documentoClean)) {
        showToast("CPF ou CNPJ inválido. Digite um documento real.", "error");
        resetRegisterBtn();
        return;
      }

      // 2. Trava de Duplicidade Antecipada (Local)
      // Impede de abrir o modal OTP se o usuário já estiver na memória cache.
      let empresas = JSON.parse(localStorage.getItem('oppah_empresas') || '[]');
      if (empresas.some(emp => emp.documento === documentoClean)) {
        showToast("Este CPF/CNPJ já possui uma conta cadastrada no Portal.", "error");
        resetRegisterBtn();
        return;
      }

      const nomeEmpresa = document.getElementById('reg-company').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const senha = document.getElementById('reg-password').value;

      const validade = new Date();
      validade.setDate(validade.getDate() + 7);

      pendingRegistrationData = {
        id_empresa: 'EMP-' + Date.now(),
        documento: documentoClean,
        nome_empresa: nomeEmpresa,
        email: email,
        senha: senha,
        licencas_totais: 1,
        validade: validade.toISOString()
      };

      // 3. Geração e Envio do OTP
      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById('otp-email-display').innerText = email;

      const cfg = JSON.parse(localStorage.getItem('oppah_config_api') || '{}');
      if (cfg.webhookOTP) {
        try {
          await fetch(cfg.webhookOTP, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, nome: nomeEmpresa, otp: generatedOTP })
          });
          showToast("Código de verificação enviado para o seu e-mail!", "success");
        } catch (err) {
          console.warn("Falha no Webhook OTP, modo fallback acionado.", err);
          showToast(`[Modo Offline] Seu código é: ${generatedOTP}`, "success");
        }
      } else {
        showToast(`[Modo Teste Local] Seu código OTP é: ${generatedOTP}`, "success");
      }

      resetRegisterBtn();

      // Abre a tela de validação (OTP)
      const modal = document.getElementById('modal-otp');
      const content = document.getElementById('modal-otp-content');
      modal.classList.remove('hidden');
      setTimeout(() => {
        content.classList.remove('scale-95', 'opacity-0');
        content.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function resetRegisterBtn() {
      document.getElementById('btn-register-text').innerText = "Verificar E-mail e Cadastrar";
      document.getElementById('btn-register-icon').className = "fa-solid fa-shield-halved text-xs";
    }

    async function verifyOTP(e) {
      e.preventDefault();
      
      const userCode = document.getElementById('otp-input-code').value.trim();
      if (userCode !== generatedOTP) {
        showToast("Código de verificação incorreto.", "error");
        return;
      }

      const btn = document.getElementById('btn-verify-otp');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registrando Conta...';
      
      const cfg = JSON.parse(localStorage.getItem('oppah_config_api') || '{}');
      let isDuplicateOnCloud = false;

      // 4. Gravação na Nuvem (SharePoint)
      if (cfg.webhookRegister) {
        try {
          const resp = await fetch(cfg.webhookRegister, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(pendingRegistrationData)
          });
          
          if (!resp.ok) {
            // Se o SharePoint retornar erro (ex: Duplicidade da Coluna Documento)
            isDuplicateOnCloud = true;
          }
        } catch (err) {
          console.warn("Erro de conexão com o SharePoint:", err);
        }
      }

      // 5. Tratamento de Erro de Duplicidade Real (Nuvem)
      if (isDuplicateOnCloud) {
        showToast("Bloqueado: Este CPF/CNPJ já está registrado no nosso servidor.", "error");
        btn.innerHTML = 'Confirmar Conta';
        cancelOTP();
        return; // ABORTA O FLUXO: Não salva localmente e avisa o cliente.
      }

      // Se passou por tudo (ou salvou na nuvem com sucesso, ou está em modo 100% offline intencional)
      let empresas = JSON.parse(localStorage.getItem('oppah_empresas') || '[]');
      empresas.push(pendingRegistrationData);
      localStorage.setItem('oppah_empresas', JSON.stringify(empresas));

      showToast("Conta criada e verificada com sucesso!", "success");
      
      // Reseta e volta pro login
      btn.innerHTML = 'Confirmar Conta';
      cancelOTP();
      switchTab('login');
      document.getElementById('form-register').reset();
      document.getElementById('login-email').value = pendingRegistrationData.email;
    }

    function cancelOTP() {
      const modal = document.getElementById('modal-otp');
      const content = document.getElementById('modal-otp-content');
      content.classList.remove('scale-100', 'opacity-100');
      content.classList.add('scale-95', 'opacity-0');
      setTimeout(() => { modal.classList.add('hidden'); }, 300);
      pendingRegistrationData = null;
      generatedOTP = null;
      document.getElementById('otp-input-code').value = '';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btnText = document.getElementById('btn-login-text');
      const btnIcon = document.getElementById('btn-login-icon');
      btnText.innerText = "Autenticando...";
      btnIcon.className = "fa-solid fa-spinner fa-spin text-xs";

      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-password').value;
      const cfg = JSON.parse(localStorage.getItem('oppah_config_api') || '{}');

      // Tenta login via Nuvem
      if (cfg.webhookLogin) {
        try {
          const resp = await fetch(cfg.webhookLogin, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha })
          });
          
          if (resp.ok) {
            const data = await resp.json();
            if (data && data.autenticado) {
              if (data.validade && new Date(data.validade) < new Date()) {
                showToast('A licença desta empresa expirou.', 'error');
                resetLoginBtn(); return;
              }
              const sessao = { tipo: data.tipo, id_empresa: data.id_empresa, email: data.email, nome_empresa: data.nome_empresa };
              localStorage.setItem('oppah_session', JSON.stringify(sessao));
              showToast(`Login efetuado com sucesso!`, 'success');
              setTimeout(() => location.reload(), 1000);
              return;
            } else {
              showToast('E-mail ou senha incorretos.', 'error');
              resetLoginBtn(); return;
            }
          }
        } catch (err) {
          console.warn("SharePoint indisponível, checando cache local...", err);
        }
      }

      // Fallback de Login (Local Cache)
      const empresas = JSON.parse(localStorage.getItem('oppah_empresas') || '[]');
      const gestor = empresas.find(emp => emp.email.toLowerCase() === email.toLowerCase() && emp.senha === senha);
      
      if (gestor) {
        const sessao = { tipo: 'gestor', id_empresa: gestor.id_empresa, email: gestor.email, nome_empresa: gestor.nome_empresa };
        localStorage.setItem('oppah_session', JSON.stringify(sessao));
        showToast('Login de Gestor efetuado.', 'success');
        setTimeout(() => location.reload(), 1000);
        return;
      }

      showToast('E-mail ou senha incorretos.', 'error');
      resetLoginBtn();
    }

    function resetLoginBtn() {
      document.getElementById('btn-login-text').innerText = "Acessar Portal";
      document.getElementById('btn-login-icon').className = "fa-solid fa-arrow-right text-xs";
    }

    function handleLogout() {
      localStorage.removeItem('oppah_session');
      location.reload();
    }

    function switchTab(tab) {
      if (tab === 'login') {
        document.getElementById('form-login').classList.remove('hidden');
        document.getElementById('form-register').classList.add('hidden');
        document.getElementById('tab-login').className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-sky-500 text-white shadow-md';
        document.getElementById('tab-register').className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white';
      } else {
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-register').classList.remove('hidden');
        document.getElementById('tab-register').className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-emerald-500 text-white shadow-md';
        document.getElementById('tab-login').className = 'flex-1 py-2 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white';
      }
    }
  </script>
</body>
</html>
